# Experimental: the Antigravity desktop app, headless, driven through its web
# UI (port 8090 via the exposed-port link or `scion tunnel`). Scion-driven
# tasks, messages and credentials are not supported. See README.md.
harness: antigravity-ui
image: scion-antigravity-ui:latest
user: scion

provisioner:
  type: container-script
  interface_version: 1
  lib: vendored
  command: ["python3", "/home/scion/.scion/harness/provision.py"]
  timeout: 30s
  lifecycle_events:
    - pre-start
  required_image_tools:
    - python3

# Electron userData directory of the app.
config_dir: .config/Antigravity
# Any key is harmless: the wrapper ignores SIGINT and the app and its proxy
# run in their own sessions.
interrupt_key: Escape
ready:
  strategy: delay
  settle: 15s
# Pasted messages reach the wrapper's input sink, which answers with a
# "not delivered" notice; they never reach the app.
delivery:
  submit_keys: [Enter]
  extra_submits: 0
  extra_submit_delay: 0s
system_prompt_mode: none

# No task_flag and no resume_flag: tasks are not passed to the app, and a
# restart reopens the app with its persisted state.
command:
  base: ["/usr/local/bin/antigravity-ui-wrapper"]

env:
  ELECTRON_OZONE_PLATFORM_HINT: headless
  JETSKI_LS_PORT: "8443"
  AGUI_PROXY_PORT: "8090"

env_template:
  SCION_AGENT_NAME: "{{ .AgentName }}"

capabilities:
  limits:
    max_turns: { support: "no", reason: "The app is driven through its UI, not by Scion" }
    max_model_calls: { support: "no", reason: "The app is driven through its UI, not by Scion" }
    max_duration: { support: "yes" }
  telemetry:
    enabled: { support: "no", reason: "The app has no OTEL integration" }
    native_emitter: { support: "no" }
  prompts:
    system_prompt: { support: "no", reason: "Instructions are not projected into the app" }
    agent_instructions: { support: "no", reason: "Instructions are not projected into the app" }
  auth:
    api_key: { support: "no", reason: "Sign in inside the app UI" }
    auth_file: { support: "no" }
    oauth_token: { support: "no", reason: "Sign in inside the app UI" }
    vertex_ai: { support: "no", reason: "Sign in inside the app UI" }
  mcp:
    stdio: { support: "no" }
    sse: { support: "no" }
    streamable_http: { support: "no" }
    project_scope: { support: "no" }
