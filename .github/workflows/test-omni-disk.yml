# Temporary workflow: verify omni build disk usage on ubuntu-latest.
# This workflow will be removed once disk numbers are collected.

name: Test Omni Disk Usage

on:
  pull_request:
    paths:
      - '.github/workflows/test-omni-disk.yml'
      - '.github/workflows/build-images.yml'
      - 'image-build/**'

permissions:
  contents: read

jobs:
  omni-disk-test:
    name: Omni Build Disk Measurement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initial disk report
        run: |
          echo "=== Initial disk state ==="
          df -h /
          echo ""
          echo "=== Docker disk usage ==="
          docker system df 2>/dev/null || echo "(no docker images yet)"

      - name: Free up disk space
        run: |
          echo "=== Removing unused tooling to maximize free space ==="
          # Remove large pre-installed tools we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo ""
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build thick-prep
        run: |
          echo "=== Building thick-prep ==="
          df -h /
          image-build/scripts/build-images.sh \
            --target thick-prep \
            --platform linux/amd64
          echo ""
          echo "=== Disk after thick-prep ==="
          df -h /
          echo ""
          echo "=== Image sizes ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | head -20

      - name: Build scion-base (thick)
        run: |
          echo "=== Building scion-base on thick base ==="
          THICK_BUILD=true image-build/scripts/build-images.sh \
            --target scion-base \
            --platform linux/amd64
          echo ""
          echo "=== Disk after scion-base ==="
          df -h /
          echo ""
          echo "=== Image sizes ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | head -20

      - name: Build omni chain (6 images)
        run: |
          echo "=== Building omni chain ==="
          image-build/scripts/build-images.sh \
            --target omni \
            --platform linux/amd64
          echo ""
          echo "=== Disk after omni chain ==="
          df -h /
          echo ""
          echo "=== All image sizes ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Final disk report
        if: always()
        run: |
          echo "=== Final disk state ==="
          df -h /
          echo ""
          echo "=== Docker disk usage breakdown ==="
          docker system df -v 2>/dev/null || docker system df
          echo ""
          echo "=== All images ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
