# Native Windows build and test (ptone/scion#5514, design §5.2).
#
# WHY THIS EXISTS. The Windows private-file code (pkg/util/privatefs,
# pathcanon, filelock and their callers) is new Windows code: owner-only
# DACLs set at creation, DACL checks on open handles, reparse-point
# refusal. None of it runs on Linux, so only a real Windows runner can show
# it works. The security merge gate (checklist §5) requires these tests to
# run here, with a negative case per alias form and junction and symlink
# cases that FAIL, never skip, when the runner cannot create links.
#
# WHAT MAKES IT TRUSTWORTHY.
#   - The capability step proves, before any test runs, that this runner
#     can create symlinks and junctions, generates 8.3 short names, and has
#     a FAT32 volume. Each is a hard failure if missing: a test that cannot
#     exercise its case must not pass.
#   - The test step fails on ANY skipped test or package (zero
#     "Action":"skip" events in go test -json). The pinned skip set is
#     empty.
#   - The package list is explicit (.github/windows-test-packages.txt), with
#     no wildcard, and a guard step refuses pkg/hub: its unsharded test
#     compile needs about 12 GiB, more than a hosted runner has.
#
# WHY A SEPARATE FILE FROM ci.yml: no collision with ci.yml editors, and its
# own trigger. There is deliberately NO paths filter while the job proves
# itself stable, so it runs on every PR. If it is ever made a REQUIRED
# status check together with a paths filter, PRs that the filter skips will
# hang (a filtered-out job reports nothing), the trap macos-bash32.yml
# records. Making it required is a separate, later decision.
#
# Phase 1 note: ./cmd/scion does not compile for Windows until the Phase 2
# build-tag splits land, so the Build step builds and vets the allowlisted
# packages only. The ./cmd/scion build is added with Phase 2.

name: Windows

on:
  pull_request: {}
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test (allowlist)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
      GOGC: '50'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Allowlist guard (no pkg/hub, no wildcards)
        shell: bash
        run: |
          set -euo pipefail
          list=.github/windows-test-packages.txt
          pkgs=$(sed -e 's/\r$//' -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^[[:space:]]*$/d' "$list")
          if [ -z "$pkgs" ]; then
            echo "::error::$list lists no packages"; exit 1
          fi
          if printf '%s\n' "$pkgs" | grep -E '^\./pkg/hub($|/\.\.\.)'; then
            echo "::error::$list must never list ./pkg/hub: its unsharded test compile needs about 12 GiB"; exit 1
          fi
          if printf '%s\n' "$pkgs" | grep -F '...'; then
            echo "::error::$list must list packages explicitly, without wildcards"; exit 1
          fi
          printf '%s\n' "$pkgs"

      # Runner capabilities. Every check FAILS the job; none is skippable.
      # A symlink or junction test that cannot create its link must fail
      # (security checklist §5, §7.4), and so must the job that would make
      # it fail for a configuration reason.
      - name: Runner capabilities (fail, never skip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Tests use a temp dir on the runner's work volume.
          $tmp = Join-Path $env:RUNNER_TEMP 'gotmp'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vol = $tmp.Substring(0, 2)

          # 1. Symlink privilege, then a real symlink and a junction.
          $priv = whoami /priv | Select-String 'SeCreateSymbolicLinkPrivilege'
          if (-not $priv) { Write-Error 'SeCreateSymbolicLinkPrivilege is not held by the runner token' }
          $priv
          $probe = Join-Path $tmp 'symlink-probe'
          New-Item -ItemType SymbolicLink -Path $probe -Target $tmp | Out-Null
          if ((Get-Item $probe).LinkType -ne 'SymbolicLink') { Write-Error 'symlink creation did not produce a symlink' }
          Remove-Item $probe
          $jprobe = Join-Path $tmp 'junction-probe'
          cmd /c mklink /J "$jprobe" "$tmp"
          if ($LASTEXITCODE -ne 0) { Write-Error 'junction creation failed' }
          if ((Get-Item $jprobe).LinkType -ne 'Junction') { Write-Error 'mklink /J did not produce a junction' }
          cmd /c rmdir "$jprobe"

          # 2. Elevation: TestCreate_OwnerExplicitWhenElevated needs the
          # token's default owner to be Administrators.
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Error 'the runner is not elevated' }

          # 3. 8.3 short names on the test volume (TestWithin_ShortName8dot3).
          fsutil 8dot3name set 0
          fsutil 8dot3name set $vol 0
          fsutil 8dot3name query $vol
          $long = Join-Path $tmp 'longdirectoryname-8dot3-probe'
          New-Item -ItemType Directory -Force -Path $long | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($long).ShortPath
          if ($short -notmatch '~') { Write-Error "no 8.3 short name was generated on $vol ($short)" }
          "8.3 probe: $long -> $short"
          Remove-Item $long

          # 4. A FAT32 volume (no persistent ACLs) for TestNoPersistentACLs_Refused.
          $letter = [char[]](70..90) | Where-Object { -not (Test-Path "$($_):\") } | Select-Object -Last 1
          if (-not $letter) { Write-Error 'no free drive letter for the FAT32 volume' }
          $vhd = Join-Path $env:RUNNER_TEMP 'scion-fat32.vhd'
          $script = Join-Path $env:RUNNER_TEMP 'diskpart-fat32.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=256 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'convert mbr',
            'create partition primary',
            'format fs=fat32 quick label=SCIONFAT',
            "assign letter=$letter"
          ) | Set-Content -Path $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { Write-Error "diskpart failed ($LASTEXITCODE)" }
          $fs = (Get-Volume -DriveLetter $letter).FileSystem
          if ($fs -ne 'FAT32') { Write-Error "the test volume ${letter}: is $fs, not FAT32" }
          $info = fsutil fsinfo volumeinfo "${letter}:"
          $info
          if ($info -match 'Supports Persistent ACLs') { Write-Error "the FAT32 volume ${letter}: reports persistent ACLs" }
          "SCION_TEST_FAT_VOLUME=${letter}:\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and vet (allowlist)
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(sed -e 's/\r$//' -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^[[:space:]]*$/d' .github/windows-test-packages.txt)
          go build $pkgs
          go vet $pkgs

      - name: Test (allowlist, zero skips)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SCION_TEST_FAT_VOLUME:-}" || { echo "::error::SCION_TEST_FAT_VOLUME is not set"; exit 1; }
          pkgs=$(sed -e 's/\r$//' -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^[[:space:]]*$/d' .github/windows-test-packages.txt)
          rc=0
          go test -json -count=1 $pkgs > test.json || rc=$?
          # Human-readable failures and the per-package summary.
          grep -E '"Action":"(fail|skip)"' test.json || true
          grep -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' test.json || true
          if [ "$rc" -ne 0 ]; then
            grep -E '"Action":"output"' test.json | sed -e 's/.*"Output":"//' -e 's/"}$//' | tail -n 200
            echo "::error::go test failed (exit $rc)"; exit 1
          fi
          # Pinned skip set: empty. Any skipped test, or a package skipped for
          # having no test files, fails the job.
          if grep -q '"Action":"skip"' test.json; then
            echo "::error::tests were skipped; the Windows job allows none"; exit 1
          fi
          # Every listed package must report a pass.
          for p in $pkgs; do
            ip="github.com/GoogleCloudPlatform/scion/${p#./}"
            grep -qE "\"Action\":\"pass\",\"Package\":\"$ip\",\"Elapsed\"" test.json || { echo "::error::no package pass for $ip"; exit 1; }
          done
          echo "passed tests: $(grep -cE '"Action":"pass","Package":"[^"]*","Test":' test.json)"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-json
          path: test.json
          if-no-files-found: ignore
