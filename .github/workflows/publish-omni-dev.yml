# One-shot workflow: publish a dev omni image to GHCR for end-to-end testing.
# Delete this file after the image is published.

name: Publish Dev Omni Image

on:
  pull_request:
    paths:
      - '.github/workflows/publish-omni-dev.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Dev Omni
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push thick-prep
        run: |
          image-build/scripts/build-images.sh \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --target thick-prep \
            --tag "dev-${{ github.sha }}" \
            --platform linux/amd64 \
            --push

      - name: Build and push scion-base
        run: |
          THICK_BUILD=true image-build/scripts/build-images.sh \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --target scion-base \
            --tag "dev-${{ github.sha }}" \
            --platform linux/amd64 \
            --push

      - name: Build and push omni chain
        run: |
          image-build/scripts/build-images.sh \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --target omni \
            --tag "dev-${{ github.sha }}" \
            --platform linux/amd64 \
            --push

      - name: Report published images
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          TAG="dev-${{ github.sha }}"
          echo "=== Published images ==="
          echo "Pull reference for deploy:"
          echo "  ${REGISTRY}/scion-omni:${TAG}"
          echo ""
          echo "All published images:"
          for image in thick-prep scion-base scion-claude scion-codex scion-opencode scion-antigravity scion-grok-build scion-omni; do
            echo "  ${REGISTRY}/${image}:${TAG}"
          done
          echo ""
          echo "=== Image sizes ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Test anonymous pull (logged-out)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          TAG="dev-${{ github.sha }}"
          # Log out of GHCR to test anonymous access
          docker logout ghcr.io
          echo "Attempting anonymous manifest fetch..."
          if docker manifest inspect "${REGISTRY}/scion-omni:${TAG}" > /dev/null 2>&1; then
            echo "SUCCESS: scion-omni:${TAG} is publicly accessible"
          else
            echo "FAIL: scion-omni:${TAG} is NOT publicly accessible without auth"
            echo "The GHCR package needs to be set to public for Cloud Run to pull it."
          fi
