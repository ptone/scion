# The operator supplies the whole settings.yaml. The chart renders no Secret of
# its own, mounts the named one instead, and drops the checksum annotation -
# there is nothing for it to be a checksum of, and an annotation that never
# changes is worse than an absent one because it looks like coverage.
#
# Nothing validates the contents of a Secret supplied this way. Every invariant
# the chart enforces on the file it renders - hosted mode, the explicit hub ID,
# the preflight keys, schema_version - is the operator's responsibility here.

hub:
  hubId: ci-existing
  baseUrl: https://ci-existing.example.com

image:
  repository: us-docker.pkg.dev/example-project/example-repo/scion-hub-gke
  tag: ci

config:
  existingSecret: my-own-hub-settings

auth:
  # THE OPERATOR SUPPLIES BOTH SECRETS HERE, WHICH IS WHAT MAKES THIS FIXTURE
  # WORTH HAVING: config.existingSecret for the settings file and
  # auth.existingSecret for the session secret. The chart renders NEITHER
  # Secret, so this is the permutation that proves the two "bring your own"
  # paths compose rather than each being tested alone.
  #
  # It is also the only permutation where the hub container gets the session
  # secret through a secretKeyRef instead of an envFrom. The chart will not
  # envFrom a Secret it does not control: envFrom projects every key it finds,
  # so a stray SCION_SERVER_BASE_URL in the operator's Secret would override the
  # ConfigMap's schema-validated one and silently cost the session cookie its
  # Secure attribute. See templates/deployment.yaml.
  existingSecret: my-own-session-secret

  # NO existingSecretKey, deliberately: this fixture takes the default,
  # SCION_SERVER_SESSION_SECRET. ci/values-session-existing.yaml overrides it,
  # so the default branch and the override branch each render somewhere.
  #
  # requireStableSigningKey IS NOT SET HERE ANY MORE, and its removal is the
  # point rather than a tidy-up. This fixture used to be the only permutation
  # allowed to set it true, because true was unsatisfiable everywhere else and
  # templates/configmap-env.yaml refused it - the operator's own settings.yaml
  # was the sole route to a pre-provisioned signing key. The session-secret
  # phase renders that key for every permutation, so the refusal is gone and
  # true is simply the default. Setting it explicitly here would now assert
  # nothing. The false branch lives in ci/values-varied.yaml.
