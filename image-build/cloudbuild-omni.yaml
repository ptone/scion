# Cloud Build configuration for building the scion-omni image.
# Hub + all harnesses in a single image for Cloud Run Instances deployment.
# Builds on top of the existing scion-base:<_TAG> image.
steps:
  # Pre-flight: verify push access to catch permission errors early
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-registry'
    entrypoint: 'bash'
    args: ['image-build/scripts/verify-registry.sh', '$_REGISTRY']

  # Enable multi-arch builds
  - name: 'gcr.io/cloud-builders/docker'
    id: 'setup-buildx'
    args: ['buildx', 'create', '--name', 'mybuilder', '--use']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'bootstrap-buildx'
    args: ['buildx', 'inspect', '--bootstrap']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # Build and push scion-omni image (uses existing scion-base:<_TAG>)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-omni'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-omni:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-omni:$_TAG'
      - '-f'
      - 'image-build/omni/Dockerfile'
      - '--pull'
      - '--push'
      - '.'
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

substitutions:
  _REGISTRY: 'us-central1-docker.pkg.dev/${PROJECT_ID}/public-docker'
  _TAG: 'latest'
options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
timeout: 3600s # 60 minutes - includes npm installs and binary downloads
