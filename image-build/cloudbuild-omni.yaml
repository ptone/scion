# Omni image chain for Cloud Run Instances single-node deployment.
# Architecture: amd64 only.
#
# Chain: thick-prep → scion-base → claude → codex → opencode →
#        antigravity → grok-build → omni
#
# Each step pushes to the registry so the next step can pull it as
# BASE_IMAGE. Only scion-omni is the final deliverable.
steps:
  # Stage 1: Build thick-prep
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-thick-prep'
    dir: 'image-build/thick-prep'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '$_REGISTRY/thick-prep:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 2: Build scion-base on thick-prep
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-base'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/thick-prep:$_TAG'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGISTRY/scion-base:$_TAG'
      - '-f'
      - 'image-build/scion-base/Dockerfile'
      - '.'

  # Stage 3: scion-claude (from scion-base)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-claude'
    dir: 'harnesses/claude'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-claude:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 4: scion-codex (from scion-claude)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-codex'
    dir: 'harnesses/codex'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-claude:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-codex:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 5: scion-opencode (from scion-codex)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-opencode'
    dir: 'harnesses/opencode'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-codex:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-opencode:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 6: scion-antigravity (from scion-opencode)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-antigravity'
    dir: 'harnesses/antigravity'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-opencode:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-antigravity:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 7: scion-grok-build (from scion-antigravity)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-grok-build'
    dir: 'harnesses/grok-build'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-antigravity:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-grok-build:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 8: scion-omni (from scion-grok-build) — the final image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-omni'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-grok-build:$_TAG'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGISTRY/scion-omni:$_TAG'
      - '-f'
      - 'image-build/omni/Dockerfile'
      - '.'

# Push only scion-omni (the final deliverable).
images:
  - '$_REGISTRY/scion-omni:$_TAG'

substitutions:
  _REGISTRY: 'us-central1-docker.pkg.dev/${PROJECT_ID}/scion'
  _TAG: 'latest'
options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
timeout: 7200s
