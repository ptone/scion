<!doctype html>
<html lang="en" data-theme="dark" class="sl-theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scion Sequence Visualizer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /*
        Only size the host here. Do NOT set `display`: a document-level rule on
        the host element beats the component's own `:host` rule in the cascade,
        so `display: block` here would silently override the component's
        `display: grid` and collapse its entire layout.
      */
      #root {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <scion-seq-viz id="root"></scion-seq-viz>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
